[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kevlar"
version = "1.0.0"
description = "Automated CISA KEV threat intelligence and alerting engine"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "pydantic>=2.5"]

[project.scripts]
kevlar = "kevlar.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
